name: Bug report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the repository this bug is in.
      options:
        - component:admin
        - component:backend
        - component:common
        - component:edition
        - component:mbtiles
        - component:proxy
        - component:touristic
        - component:viewer
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
  - type: textarea
    id: desktop
    attributes:
      label: Desktop
      description: OS, browser, and version, if this is a desktop bug.
  - type: textarea
    id: smartphone
    attributes:
      label: Smartphone
      description: Device, OS, browser, and version, if this is a phone bug.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
