name: CodeQL

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            language: java
            gradle_tasks: :sitmun-backend:assemble
          - component: proxy
            language: java
            gradle_tasks: :sitmun-proxy:assemble
          - component: mbtiles
            language: java
            gradle_tasks: :sitmun-mbtiles:assemble
          - component: common
            language: java
            gradle_tasks: :sitmun-spring-upstream:assemble :sitmun-proxy-contract:assemble
          - component: admin
            language: javascript
          - component: viewer
            language: javascript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Set up Gradle
        if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java' && 'manual' || 'none' }}
      - name: Assemble
        if: matrix.language == 'java'
        run: |
          ./gradlew ${{ matrix.gradle_tasks }} --no-daemon
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}/component:${{ matrix.component }}
