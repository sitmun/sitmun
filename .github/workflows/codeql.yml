name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            directory: sitmun-backend
            language: java
            publish_common: true
          - component: proxy
            directory: sitmun-proxy
            language: java
            publish_common: true
          - component: mbtiles
            directory: sitmun-addons/sitmun-mbtiles
            language: java
            publish_common: false
          - component: common
            directory: sitmun-common
            language: java
            publish_common: false
          - component: admin
            directory: sitmun-admin
            language: javascript
            publish_common: false
          - component: viewer
            directory: sitmun-viewer
            language: javascript
            publish_common: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v5
        if: matrix.language == 'javascript'
        with:
          node-version: "24.22.0"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java' && 'manual' || 'none' }}
      - name: Publish sitmun-common
        if: matrix.publish_common
        working-directory: sitmun-common
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal
      - name: Assemble
        if: matrix.language == 'java'
        working-directory: ${{ matrix.directory }}
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}/component:${{ matrix.component }}
