name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            directory: .
            language: java
            publish_common: false
            gradle_tasks: :sitmun-backend:assemble
          - component: proxy
            directory: .
            language: java
            publish_common: false
            gradle_tasks: :sitmun-proxy:assemble
          - component: mbtiles
            directory: .
            language: java
            publish_common: false
            gradle_tasks: :sitmun-mbtiles:assemble
          - component: common
            directory: .
            language: java
            publish_common: false
            gradle_tasks: :sitmun-spring-upstream:assemble :sitmun-proxy-contract:assemble
          - component: admin
            directory: sitmun-admin
            language: javascript
            publish_common: false
          - component: viewer
            directory: sitmun-viewer
            language: javascript
            publish_common: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java' && 'manual' || 'none' }}
      - name: Assemble
        if: matrix.language == 'java'
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.gradle_tasks }} --no-daemon
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}/component:${{ matrix.component }}
