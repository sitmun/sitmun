name: Test Oracle 11

on:
  pull_request:
    branches: [dev]
    paths:
      - 'sitmun-backend/**'
      - 'profiles/oracle/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tools/tests/test_backend_db_boot.sh'
      - '.github/workflows/test-oracle-11.yml'
  workflow_dispatch:

jobs:
  # gvenzl/oracle-xe:11 is amd64 only. ubuntu-latest is amd64.
  test-oracle-11:
    name: Test Oracle 11
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SITMUN_DB: oracle-11
      SITMUN_DB_KEEP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - name: Boot the backend
        run: bash tools/tests/test_backend_db_boot.sh

      # The suite drops and rebuilds the schema, so it runs after the production-changelog boot.
      - name: Run backend tests
        if: ${{ !cancelled() }}
        run: ./gradlew :sitmun-backend:testOracle11

      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-oracle-11-report
          path: sitmun-backend/build/reports/tests/testOracle11
          retention-days: 7
