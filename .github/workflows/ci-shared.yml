name: CI shared

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew :sitmun-spring-upstream:spotlessCheck :sitmun-spring-upstream:test :sitmun-proxy-contract:spotlessCheck :sitmun-proxy-contract:test
