name: CI admin

on:
  workflow_call:
  workflow_dispatch:

env:
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/config/npm-userconfig

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitmun-admin
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: sitmun-admin/pnpm-lock.yaml
      - run: pnpm ci
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm exec ng build --configuration=production --base-href=/admin-app/
      - name: Validate build artifacts
        run: test -d dist/admin-app && test -n "$(ls -A dist/admin-app)"
