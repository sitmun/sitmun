name: CI admin

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitmun-admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: sitmun-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build -- --configuration=production --base-href=/admin-app/
      - name: Validate build artifacts
        run: test -d dist/admin-app && test -n "$(ls -A dist/admin-app)"
