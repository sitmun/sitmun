name: E2E

on:
  workflow_call:
    inputs:
      suite:
        description: admin, viewer, contact, mia, mobile_web, or mobile_android
        required: true
        type: string
      title:
        description: Title Case check name, for example Admin
        required: true
        type: string
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        required: true
        type: choice
        options:
          - admin
          - viewer
          - contact
          - mia
          - mobile_web
          - mobile_android
      title:
        description: Title Case check name
        required: true
        type: choice
        options:
          - Admin
          - Viewer
          - Application Contact
          - MIA Cross
          - Mobile Web
          - Mobile Android

env:
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/config/npm-userconfig

jobs:
  e2e:
    name: E2E ${{ inputs.title }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.suite == 'mobile_android' && 120 || (inputs.suite == 'mia' || inputs.suite == 'mobile_web') && 60 || 45 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - name: Set up Node for admin
        if: inputs.suite == 'admin'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sitmun-admin/pnpm-lock.yaml

      - name: Set up Node for viewer
        if: inputs.suite == 'viewer'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sitmun-viewer/pnpm-lock.yaml

      - name: Set up Node for admin and viewer
        if: contains(fromJSON('["contact","mia"]'), inputs.suite)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sitmun-admin/pnpm-lock.yaml
            sitmun-viewer/pnpm-lock.yaml

      - name: Set up Node for mobile web
        if: inputs.suite == 'mobile_web'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Node for mobile Android
        if: inputs.suite == 'mobile_android'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sitmun-mobile/sitmun-edition/pnpm-lock.yaml
            sitmun-mobile/sitmun-touristic/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm ci

      - name: Install admin dependencies
        if: contains(fromJSON('["admin","contact","mia"]'), inputs.suite)
        working-directory: sitmun-admin
        run: pnpm ci

      - name: Install viewer dependencies
        if: contains(fromJSON('["viewer","contact","mia"]'), inputs.suite)
        working-directory: sitmun-viewer
        run: pnpm ci

      - name: Read the Playwright version
        if: inputs.suite != 'mobile_android'
        id: playwright-version
        run: |
          version=$(python3 -c "import pathlib,re; text=pathlib.Path('pnpm-lock.yaml').read_text(); match=re.search(r'playwright@(\d+\.\d+\.\d+)', text); assert match; print(match.group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: inputs.suite != 'mobile_android'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: inputs.suite != 'mobile_android' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: inputs.suite != 'mobile_android' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run the suite
        if: inputs.suite != 'mobile_android'
        env:
          CI: true
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            admin) pnpm run e2e ;;
            viewer) pnpm run e2e:viewer ;;
            contact) pnpm exec playwright test --config=playwright.application-contact.config.ts ;;
            mia) pnpm run e2e:mia-cross ;;
            mobile_web) pnpm run e2e:mobile:web ;;
            *) echo "unknown suite: $SUITE" >&2; exit 1 ;;
          esac

      - name: Enable KVM
        if: inputs.suite == 'mobile_android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI (pinned)
        if: inputs.suite == 'mobile_android'
        run: |
          MAESTRO_VERSION=2.6.1
          EXPECTED_SHA256=3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${EXPECTED_SHA256}  /tmp/maestro.zip" | sha256sum -c -
          rm -rf "$HOME/.maestro"
          unzip -q /tmp/maestro.zip -d "$HOME"
          mv "$HOME/maestro" "$HOME/.maestro"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Android mobile E2E suite
        if: inputs.suite == 'mobile_android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none -no-snapshot-load -no-snapshot-save
          script: pnpm run e2e:mobile:android
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure() && inputs.suite != 'mobile_android'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ inputs.suite }}-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Android E2E artifacts
        if: failure() && inputs.suite == 'mobile_android'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ inputs.suite }}-artifacts
          path: test-results/mobile-android/
          retention-days: 7
