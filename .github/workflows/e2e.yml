name: E2E

on:
  workflow_call:
    inputs:
      suite:
        description: admin, viewer, contact, mia, mobile_web, mobile_android, or all
        required: true
        type: string
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        required: true
        type: choice
        options:
          - admin
          - viewer
          - contact
          - mia
          - mobile_web
          - mobile_android
          - all

env:
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/config/npm-userconfig

jobs:
  e2e-admin:
    if: inputs.suite == 'admin' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sitmun-admin/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm ci

      - name: Install admin dependencies
        working-directory: sitmun-admin
        run: pnpm ci

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run admin E2E suite
        run: pnpm run e2e
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-admin-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-viewer:
    if: inputs.suite == 'viewer' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node from sitmun-viewer/.nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sitmun-viewer/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm ci

      - name: Install viewer dependencies
        working-directory: sitmun-viewer
        run: pnpm ci

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run viewer E2E suite
        run: pnpm run e2e:viewer
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-viewer-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-application-contact:
    if: inputs.suite == 'contact' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node from sitmun-viewer/.nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sitmun-admin/pnpm-lock.yaml
            sitmun-viewer/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm ci

      - name: Install admin dependencies
        working-directory: sitmun-admin
        run: pnpm ci

      - name: Install viewer dependencies
        working-directory: sitmun-viewer
        run: pnpm ci

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run application-contact E2E suite
        run: pnpm exec playwright test --config=playwright.application-contact.config.ts
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-application-contact-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-mia-cross:
    if: inputs.suite == 'mia' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node from sitmun-viewer/.nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sitmun-admin/pnpm-lock.yaml
            sitmun-viewer/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm ci

      - name: Install admin dependencies
        working-directory: sitmun-admin
        run: pnpm ci

      - name: Install viewer dependencies
        working-directory: sitmun-viewer
        run: pnpm ci

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run MIA cross E2E suite
        run: pnpm run e2e:mia-cross
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-mia-cross-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-mobile-web:
    if: inputs.suite == 'mobile_web' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm ci

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run mobile web E2E suite
        run: pnpm run e2e:mobile:web
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-mobile-web-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-mobile-android:
    if: inputs.suite == 'mobile_android' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sitmun-mobile/sitmun-edition/pnpm-lock.yaml
            sitmun-mobile/sitmun-touristic/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI (pinned)
        run: |
          MAESTRO_VERSION=2.6.1
          EXPECTED_SHA256=3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${EXPECTED_SHA256}  /tmp/maestro.zip" | sha256sum -c -
          rm -rf "$HOME/.maestro"
          unzip -q /tmp/maestro.zip -d "$HOME"
          mv "$HOME/maestro" "$HOME/.maestro"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Android mobile E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # Replaces the action default `-gpu swiftshader_indirect` (deprecated in
          # emulator 36.4.9). `-gpu software` is the current Android software mode.
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none -no-snapshot-load -no-snapshot-save
          script: pnpm run e2e:mobile:android
        env:
          CI: true

      - name: Upload Android E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-android-artifacts
          path: test-results/mobile-android/
          retention-days: 7
