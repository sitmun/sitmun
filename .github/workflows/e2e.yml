name: E2E

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      viewer: ${{ steps.filter.outputs.viewer }}
      contact: ${{ steps.filter.outputs.contact }}
      mia: ${{ steps.filter.outputs.mia }}
      mobile_web: ${{ steps.filter.outputs.mobile_web }}
      mobile_android: ${{ steps.filter.outputs.mobile_android }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'sitmun-admin/**'
              - 'sitmun-backend/**'
              - 'sitmun-common/**'
              - 'e2e/admin/**'
              - 'e2e/fixtures/**'
              - 'scripts/e2e-admin.mjs'
              - 'scripts/e2e-backend.mjs'
              - 'scripts/e2e-process.mjs'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/e2e.yml'
            viewer:
              - 'sitmun-viewer/**'
              - 'sitmun-backend/**'
              - 'sitmun-proxy/**'
              - 'sitmun-common/**'
              - 'e2e/viewer/**'
              - 'e2e/fixtures/**'
              - 'scripts/e2e-viewer.mjs'
              - 'scripts/e2e-backend.mjs'
              - 'scripts/e2e-proxy.mjs'
              - 'scripts/e2e-wms-stub.mjs'
              - 'scripts/e2e-process.mjs'
              - 'playwright.viewer.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/e2e.yml'
            contact:
              - 'sitmun-admin/**'
              - 'sitmun-viewer/**'
              - 'sitmun-backend/**'
              - 'sitmun-common/**'
              - 'e2e/application-contact/**'
              - 'e2e/fixtures/**'
              - 'scripts/e2e-admin.mjs'
              - 'scripts/e2e-viewer.mjs'
              - 'scripts/e2e-backend.mjs'
              - 'scripts/e2e-process.mjs'
              - 'playwright.application-contact.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/e2e.yml'
            mia:
              - 'sitmun-admin/**'
              - 'sitmun-viewer/**'
              - 'sitmun-backend/**'
              - 'sitmun-proxy/**'
              - 'sitmun-common/**'
              - 'e2e/mia-cross/**'
              - 'e2e/fixtures/**'
              - 'scripts/e2e-admin.mjs'
              - 'scripts/e2e-viewer.mjs'
              - 'scripts/e2e-backend.mjs'
              - 'scripts/e2e-proxy.mjs'
              - 'scripts/e2e-wms-stub.mjs'
              - 'scripts/e2e-process.mjs'
              - 'playwright.mia-cross.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/e2e.yml'
            mobile_web:
              - 'sitmun-mobile/**'
              - 'sitmun-backend/**'
              - 'sitmun-proxy/**'
              - 'sitmun-addons/**'
              - 'sitmun-common/**'
              - 'e2e/mobile/**'
              - 'scripts/e2e-backend-mobile.mjs'
              - 'scripts/e2e-proxy-mobile.mjs'
              - 'scripts/e2e-mbtiles.mjs'
              - 'scripts/e2e-process.mjs'
              - 'playwright.mobile.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/e2e.yml'
            mobile_android:
              - 'sitmun-mobile/**'
              - 'sitmun-backend/**'
              - 'sitmun-proxy/**'
              - 'sitmun-addons/**'
              - 'sitmun-common/**'
              - 'e2e/mobile/**'
              - 'scripts/e2e-mobile-android.mjs'
              - 'scripts/e2e-backend-mobile.mjs'
              - 'scripts/e2e-proxy-mobile.mjs'
              - 'scripts/e2e-mbtiles.mjs'
              - 'scripts/e2e-process.mjs'
              - 'playwright.mobile.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/e2e.yml'

  e2e-admin:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish sitmun-shared to the local Maven repository
        run: |
          chmod +x sitmun-common/gradlew
          sitmun-common/gradlew -p sitmun-common publishToMavenLocal

      - name: Set up Node 24.22.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sitmun-admin/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: sitmun-admin
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run admin E2E suite
        run: npm run e2e
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-admin-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-viewer:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish sitmun-shared to the local Maven repository
        run: |
          chmod +x sitmun-common/gradlew
          sitmun-common/gradlew -p sitmun-common publishToMavenLocal

      - name: Set up Node 24.22.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sitmun-viewer/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install viewer dependencies
        working-directory: sitmun-viewer
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # e2e-viewer.mjs requires ~/.nvm/versions/node/v<nvmrc>/bin (setup-node does not).
      # dcodeIO/setup-node-nvm installs into $HOME/mynvm; link that tree to ~/.nvm.
      - name: Read viewer .nvmrc
        id: viewer-nvmrc
        run: |
          ver="$(tr -d '[:space:]' < sitmun-viewer/.nvmrc)"
          echo "version=${ver#v}" >> "$GITHUB_OUTPUT"
      - name: Install viewer Node into nvm
        uses: dcodeIO/setup-node-nvm@v5
        with:
          node-version: ${{ steps.viewer-nvmrc.outputs.version }}
      - name: Point ~/.nvm at setup-node-nvm install
        run: |
          # Ubuntu runners often ship ~/.nvm as a real directory; ln -sfn into a
          # directory nests the link. Replace it so e2e-viewer.mjs finds node.
          echo "NVM_DIR=${HOME}/mynvm" >> "$GITHUB_ENV"
          rm -rf "${HOME}/.nvm"
          ln -sfn "${HOME}/mynvm" "${HOME}/.nvm"
          ver="$(tr -d '[:space:]' < sitmun-viewer/.nvmrc)"
          ver="${ver#v}"
          test -x "${HOME}/.nvm/versions/node/v${ver}/bin/node"

      - name: Run viewer E2E suite
        run: npm run e2e:viewer
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-viewer-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-application-contact:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.contact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish sitmun-shared to the local Maven repository
        run: |
          chmod +x sitmun-common/gradlew
          sitmun-common/gradlew -p sitmun-common publishToMavenLocal

      - name: Set up Node 24.22.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sitmun-admin/package-lock.json
            sitmun-viewer/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: sitmun-admin
        run: npm ci

      - name: Install viewer dependencies
        working-directory: sitmun-viewer
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # e2e-viewer.mjs requires ~/.nvm/versions/node/v<nvmrc>/bin (setup-node does not).
      # dcodeIO/setup-node-nvm installs into $HOME/mynvm; link that tree to ~/.nvm.
      - name: Read viewer .nvmrc
        id: viewer-nvmrc
        run: |
          ver="$(tr -d '[:space:]' < sitmun-viewer/.nvmrc)"
          echo "version=${ver#v}" >> "$GITHUB_OUTPUT"
      - name: Install viewer Node into nvm
        uses: dcodeIO/setup-node-nvm@v5
        with:
          node-version: ${{ steps.viewer-nvmrc.outputs.version }}
      - name: Point ~/.nvm at setup-node-nvm install
        run: |
          # Ubuntu runners often ship ~/.nvm as a real directory; ln -sfn into a
          # directory nests the link. Replace it so e2e-viewer.mjs finds node.
          echo "NVM_DIR=${HOME}/mynvm" >> "$GITHUB_ENV"
          rm -rf "${HOME}/.nvm"
          ln -sfn "${HOME}/mynvm" "${HOME}/.nvm"
          ver="$(tr -d '[:space:]' < sitmun-viewer/.nvmrc)"
          ver="${ver#v}"
          test -x "${HOME}/.nvm/versions/node/v${ver}/bin/node"

      - name: Run application-contact E2E suite
        run: npx playwright test --config=playwright.application-contact.config.ts
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-application-contact-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-mia-cross:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.mia == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish sitmun-shared to the local Maven repository
        run: |
          chmod +x sitmun-common/gradlew
          sitmun-common/gradlew -p sitmun-common publishToMavenLocal

      - name: Set up Node 24.22.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sitmun-admin/package-lock.json
            sitmun-viewer/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: sitmun-admin
        run: npm ci

      - name: Install viewer dependencies
        working-directory: sitmun-viewer
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # e2e-viewer.mjs requires ~/.nvm/versions/node/v<nvmrc>/bin (setup-node does not).
      # dcodeIO/setup-node-nvm installs into $HOME/mynvm; link that tree to ~/.nvm.
      - name: Read viewer .nvmrc
        id: viewer-nvmrc
        run: |
          ver="$(tr -d '[:space:]' < sitmun-viewer/.nvmrc)"
          echo "version=${ver#v}" >> "$GITHUB_OUTPUT"
      - name: Install viewer Node into nvm
        uses: dcodeIO/setup-node-nvm@v5
        with:
          node-version: ${{ steps.viewer-nvmrc.outputs.version }}
      - name: Point ~/.nvm at setup-node-nvm install
        run: |
          # Ubuntu runners often ship ~/.nvm as a real directory; ln -sfn into a
          # directory nests the link. Replace it so e2e-viewer.mjs finds node.
          echo "NVM_DIR=${HOME}/mynvm" >> "$GITHUB_ENV"
          rm -rf "${HOME}/.nvm"
          ln -sfn "${HOME}/mynvm" "${HOME}/.nvm"
          ver="$(tr -d '[:space:]' < sitmun-viewer/.nvmrc)"
          ver="${ver#v}"
          test -x "${HOME}/.nvm/versions/node/v${ver}/bin/node"

      - name: Run MIA cross E2E suite
        run: npm run e2e:mia-cross
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-mia-cross-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-mobile-web:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish sitmun-shared to the local Maven repository
        run: |
          chmod +x sitmun-common/gradlew
          sitmun-common/gradlew -p sitmun-common publishToMavenLocal

      - name: Set up Node 24.22.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile web E2E suite
        run: npm run e2e:mobile:web
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-mobile-web-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-mobile-android:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish sitmun-shared to the local Maven repository
        run: |
          chmod +x sitmun-common/gradlew
          sitmun-common/gradlew -p sitmun-common publishToMavenLocal

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sitmun-mobile/sitmun-edition/package-lock.json
            sitmun-mobile/sitmun-touristic/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI (pinned)
        run: |
          MAESTRO_VERSION=2.6.1
          EXPECTED_SHA256=3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${EXPECTED_SHA256}  /tmp/maestro.zip" | sha256sum -c -
          rm -rf "$HOME/.maestro"
          unzip -q /tmp/maestro.zip -d "$HOME"
          mv "$HOME/maestro" "$HOME/.maestro"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Android mobile E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # Replaces the action default `-gpu swiftshader_indirect` (deprecated in
          # emulator 36.4.9). `-gpu software` is the current Android software mode.
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none -no-snapshot-load -no-snapshot-save
          script: npm run e2e:mobile:android
        env:
          CI: true

      - name: Upload Android E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-android-artifacts
          path: test-results/mobile-android/
          retention-days: 7
