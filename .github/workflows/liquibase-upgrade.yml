name: Liquibase upgrade

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
    branches: [dev]
    paths:
      - 'profiles/postgres/liquibase/**'
      - 'profiles/oracle/liquibase/**'
      - 'profiles/development/backend/liquibase/**'
      - 'sitmun-backend/config/db/**'
      - 'tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh'
      - 'tools/tests/test_liquibase_codelist_auth_mode_swap.sh'
      - 'tools/tests/test_prepare_extracted_liquibase.py'
      - 'tools/bin/prepare_extracted_liquibase.py'
      - '.github/workflows/liquibase-upgrade.yml'
  workflow_dispatch:
    inputs:
      db:
        description: Database to upgrade, or all
        required: true
        type: choice
        default: all
        options:
          - all
          - postgres-12
          - postgres-16
          - oracle-11
          - oracle-19
          - oracle-23
      source:
        description: Optional X.Y.Z override for a single upgrade-from run
        required: false
        default: ''

jobs:
  prepare-extracted-unit:
    name: Prepare extracted unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extracted-tree helper unit tests
        run: python3 tools/tests/test_prepare_extracted_liquibase.py

  postgres-1-2-7-to-head:
    name: Upgrade PostgreSQL through 1.2.8 failure
    if: github.event_name != 'workflow_dispatch' || (inputs.db == 'all' || inputs.db == 'postgres-16') && inputs.source == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch 1.2.7 and 1.2.8 tags
        run: |
          git fetch --no-tags origin tag legacy/sitmun-application-stack/sitmun-application-stack/1.2.7
          git fetch --no-tags origin tag legacy/sitmun-application-stack/sitmun-application-stack/1.2.8

      - name: Upgrade 1.2.7 then 1.2.8 fail then HEAD
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh postgres

  postgres-12-from:
    name: Upgrade PostgreSQL 12 from ${{ matrix.source }}
    if: github.event_name != 'workflow_dispatch' || inputs.db == 'all' || inputs.db == 'postgres-12'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.source != '' && format('["{0}"]', inputs.source) || '["1.2.6","1.2.7","1.2.8"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the source version
        env:
          SOURCE: ${{ matrix.source }}
        run: '[[ "$SOURCE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Fetch source tag
        env:
          SOURCE: ${{ matrix.source }}
        run: git fetch --no-tags origin tag "legacy/sitmun-application-stack/sitmun-application-stack/${SOURCE}"

      - name: Upgrade ${{ matrix.source }} to HEAD
        env:
          SOURCE: ${{ matrix.source }}
          SITMUN_POSTGRES_IMAGE: postgres:12-alpine
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh postgres-from "$SOURCE"

  postgres-16-from:
    name: Upgrade PostgreSQL 16 from ${{ matrix.source }}
    if: github.event_name != 'workflow_dispatch' || inputs.db == 'all' || inputs.db == 'postgres-16'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.source != '' && format('["{0}"]', inputs.source) || '["1.2.6","1.2.7","1.2.8"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the source version
        env:
          SOURCE: ${{ matrix.source }}
        run: '[[ "$SOURCE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Fetch source tag
        env:
          SOURCE: ${{ matrix.source }}
        run: git fetch --no-tags origin tag "legacy/sitmun-application-stack/sitmun-application-stack/${SOURCE}"

      - name: Upgrade ${{ matrix.source }} to HEAD
        env:
          SOURCE: ${{ matrix.source }}
          SITMUN_POSTGRES_IMAGE: postgres:16-alpine
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh postgres-from "$SOURCE"

  postgres-auth-mode-swap:
    name: Swap auth mode code list
    if: github.event_name != 'workflow_dispatch' || (inputs.db == 'all' || inputs.db == 'postgres-16') && inputs.source == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Auth-mode COD_ID swap (#45)
        run: bash tools/tests/test_liquibase_codelist_auth_mode_swap.sh

  # Forward-compatibility check. No install runs Oracle 23.
  oracle-23-from:
    name: Upgrade Oracle 23 from ${{ matrix.source }}
    if: github.event_name != 'workflow_dispatch' || inputs.db == 'all' || inputs.db == 'oracle-23'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.source != '' && format('["{0}"]', inputs.source) || '["1.2.6","1.2.7","1.2.8"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the source version
        env:
          SOURCE: ${{ matrix.source }}
        run: '[[ "$SOURCE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Fetch source tag
        env:
          SOURCE: ${{ matrix.source }}
        run: git fetch --no-tags origin tag "legacy/sitmun-application-stack/sitmun-application-stack/${SOURCE}"

      - name: Upgrade ${{ matrix.source }} to HEAD
        env:
          SOURCE: ${{ matrix.source }}
          SITMUN_ORACLE_IMAGE: gvenzl/oracle-free:23-slim
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh oracle-from "$SOURCE"

  # Issue #74: DIBA runs the oracle profile on 19c. gvenzl/oracle-xe:21-slim stands
  # in for that install. The image is amd64 only, which the ubuntu-latest runners are.
  oracle-19-from:
    name: Upgrade Oracle 19 from ${{ matrix.source }}
    if: github.event_name != 'workflow_dispatch' || inputs.db == 'all' || inputs.db == 'oracle-19'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.source != '' && format('["{0}"]', inputs.source) || '["1.2.6","1.2.7","1.2.8"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the source version
        env:
          SOURCE: ${{ matrix.source }}
        run: '[[ "$SOURCE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Fetch source tag
        env:
          SOURCE: ${{ matrix.source }}
        run: git fetch --no-tags origin tag "legacy/sitmun-application-stack/sitmun-application-stack/${SOURCE}"

      - name: Upgrade ${{ matrix.source }} to HEAD
        env:
          SOURCE: ${{ matrix.source }}
          SITMUN_ORACLE_IMAGE: gvenzl/oracle-xe:21-slim
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh oracle-from "$SOURCE"

  # gvenzl/oracle-xe:11 is amd64 only. ubuntu-latest is amd64. Do not run this image on an Apple M1.
  # The Liquibase image brings its own Oracle driver.
  oracle-11-from:
    name: Upgrade Oracle 11 from ${{ matrix.source }}
    if: github.event_name != 'workflow_dispatch' || inputs.db == 'all' || inputs.db == 'oracle-11'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.source != '' && format('["{0}"]', inputs.source) || '["1.2.6","1.2.7","1.2.8"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the source version
        env:
          SOURCE: ${{ matrix.source }}
        run: '[[ "$SOURCE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Fetch source tag
        env:
          SOURCE: ${{ matrix.source }}
        run: git fetch --no-tags origin tag "legacy/sitmun-application-stack/sitmun-application-stack/${SOURCE}"

      - name: Upgrade ${{ matrix.source }} to HEAD
        env:
          SOURCE: ${{ matrix.source }}
          SITMUN_ORACLE_IMAGE: gvenzl/oracle-xe:11
          SITMUN_ORACLE_VERSION: "11"
          SITMUN_ORACLE_WAIT_TRIES: 300
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh oracle-from "$SOURCE"

  dev-postgres-from:
    name: Upgrade development PostgreSQL from 1.2.6
    if: github.event_name != 'workflow_dispatch' || inputs.db == 'all' || inputs.db == 'postgres-16'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the source version
        env:
          SOURCE: ${{ inputs.source || '1.2.6' }}
        run: '[[ "$SOURCE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Fetch the source tag
        env:
          SOURCE: ${{ inputs.source || '1.2.6' }}
        run: git fetch --no-tags origin tag "legacy/sitmun-application-stack/sitmun-application-stack/${SOURCE}"

      - name: Upgrade development PostgreSQL to HEAD
        env:
          SOURCE: ${{ inputs.source || '1.2.6' }}
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh dev-postgres-from "$SOURCE"

  dev-oracle-from:
    name: Upgrade development Oracle from 1.2.6
    if: github.event_name != 'workflow_dispatch' || inputs.db == 'all' || inputs.db == 'oracle-23'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the source version
        env:
          SOURCE: ${{ inputs.source || '1.2.6' }}
        run: '[[ "$SOURCE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Fetch the source tag
        env:
          SOURCE: ${{ inputs.source || '1.2.6' }}
        run: git fetch --no-tags origin tag "legacy/sitmun-application-stack/sitmun-application-stack/${SOURCE}"

      - name: Upgrade development Oracle to HEAD
        env:
          SOURCE: ${{ inputs.source || '1.2.6' }}
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh dev-oracle-from "$SOURCE"
