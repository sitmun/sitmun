name: ci-gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      viewer: ${{ steps.filter.outputs.viewer }}
      backend: ${{ steps.filter.outputs.backend }}
      proxy: ${{ steps.filter.outputs.proxy }}
      mbtiles: ${{ steps.filter.outputs.mbtiles }}
      shared: ${{ steps.filter.outputs.shared }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e_admin: ${{ steps.filter.outputs.e2e_admin }}
      e2e_viewer: ${{ steps.filter.outputs.e2e_viewer }}
      e2e_contact: ${{ steps.filter.outputs.e2e_contact }}
      e2e_mia: ${{ steps.filter.outputs.e2e_mia }}
      e2e_mobile_web: ${{ steps.filter.outputs.e2e_mobile_web }}
      e2e_mobile_android: ${{ steps.filter.outputs.e2e_mobile_android }}
      tier: ${{ steps.filter.outputs.tier }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the required code-list manifest
        run: python3 tools/tests/test_inventory_codelist_consumers.py
      - name: Select changed components
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            python3 tools/bin/ci_scope.py --all --flags >> "$GITHUB_OUTPUT"
          else
            python3 tools/bin/ci_scope.py --base "$BASE" --head "$HEAD" --flags >> "$GITHUB_OUTPUT"
          fi
  admin:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/ci-admin.yml
  viewer:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.viewer == 'true'
    uses: ./.github/workflows/ci-viewer.yml
  backend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml
  proxy:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.proxy == 'true'
    uses: ./.github/workflows/ci-proxy.yml
  mbtiles:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mbtiles == 'true'
    uses: ./.github/workflows/ci-mbtiles.yml
  shared:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true'
    uses: ./.github/workflows/ci-shared.yml
  docker:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/ci-docker.yml
  e2e-admin:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e_admin == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      suite: admin
      title: Admin
  e2e-viewer:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e_viewer == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      suite: viewer
      title: Viewer
  e2e-contact:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e_contact == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      suite: contact
      title: Application Contact
  e2e-mia:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e_mia == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      suite: mia
      title: MIA Cross
  e2e-mobile-web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e_mobile_web == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      suite: mobile_web
      title: Mobile Web
  e2e-mobile-android:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e_mobile_android == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      suite: mobile_android
      title: Mobile Android

  required-codelists:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tier == 'persistence'
    uses: ./.github/workflows/required-codelists.yml

  dictionary:
    name: Data Dictionary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: sitmun-admin/pnpm-lock.yaml
      - name: Install admin dependencies
        working-directory: sitmun-admin
        run: pnpm ci
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/config/npm-userconfig
      - name: Check baseline catalogs against the data dictionary
        run: |
          python3 tools/bin/check_data_dictionary.py \
            --sql sitmun-backend/src/main/resources/db/changelog/baseline/01-schema.postgresql.sql \
            --sql sitmun-backend/src/main/resources/db/changelog/baseline/01-schema.oracle.sql \
            --sql sitmun-backend/src/test/resources/db/changelog-test/01-schema.h2.sql
      - name: Check admin and viewer forms against the data dictionary
        run: |
          node tools/bin/check_data_dictionary_clients.mjs --app sitmun-admin
          node tools/bin/check_data_dictionary_clients.mjs --app sitmun-viewer
      - name: Run the Java data dictionary test
        run: ./gradlew :sitmun-backend:test --tests org.sitmun.dictionary.DataDictionaryConformanceTest -Dsitmun.dictionary.fail=true

  ci-gate:
    name: ci-gate
    needs: [changes, admin, viewer, backend, proxy, mbtiles, shared, docker, e2e-admin, e2e-viewer, e2e-contact, e2e-mia, e2e-mobile-web, e2e-mobile-android, required-codelists, dictionary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require component results
        env:
          CHANGES: ${{ needs.changes.result }}
          ADMIN: ${{ needs.admin.result }}
          VIEWER: ${{ needs.viewer.result }}
          BACKEND: ${{ needs.backend.result }}
          PROXY: ${{ needs.proxy.result }}
          MBTILES: ${{ needs.mbtiles.result }}
          SHARED: ${{ needs.shared.result }}
          DOCKER: ${{ needs.docker.result }}
          E2E_ADMIN: ${{ needs.e2e-admin.result }}
          E2E_VIEWER: ${{ needs.e2e-viewer.result }}
          E2E_CONTACT: ${{ needs.e2e-contact.result }}
          E2E_MIA: ${{ needs.e2e-mia.result }}
          E2E_MOBILE_WEB: ${{ needs.e2e-mobile-web.result }}
          E2E_MOBILE_ANDROID: ${{ needs.e2e-mobile-android.result }}
          REQUIRED_CODELISTS: ${{ needs.required-codelists.result }}
          DICTIONARY: ${{ needs.dictionary.result }}
        run: |
          python3 - << 'PY'
          import os, sys
          names = (
              "CHANGES",
              "ADMIN", "VIEWER", "BACKEND", "PROXY", "MBTILES", "SHARED", "DOCKER",
              "E2E_ADMIN", "E2E_VIEWER", "E2E_CONTACT", "E2E_MIA",
              "E2E_MOBILE_WEB", "E2E_MOBILE_ANDROID",
              "REQUIRED_CODELISTS",
              "DICTIONARY",
          )
          bad = [name for name in names if os.environ[name] in ("failure", "cancelled")]
          if bad:
              sys.exit("failed: " + ", ".join(bad))
          PY
