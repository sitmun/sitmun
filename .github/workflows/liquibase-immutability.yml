name: Liquibase immutability

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
    branches: [dev]
    paths:
      - 'profiles/**/liquibase/**'
      - 'sitmun-backend/config/db/**'
      - 'tools/bin/check_changelog_immutability.py'
      - 'tools/tests/test_changelog_immutability.py'
      - '.github/workflows/liquibase-immutability.yml'
  workflow_dispatch:

jobs:
  changelog-immutability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python3 tools/tests/test_changelog_immutability.py

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: PR diff gate
        if: github.event_name == 'pull_request'
        run: python3 tools/bin/check_changelog_immutability.py --base "origin/${{ github.base_ref }}"

      - name: Working-tree gate
        if: github.event_name != 'pull_request'
        run: python3 tools/bin/check_changelog_immutability.py
