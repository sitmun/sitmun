name: CI viewer

on:
  workflow_call:
  workflow_dispatch:

env:
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/config/npm-userconfig

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitmun-viewer
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: sitmun-viewer/pnpm-lock.yaml
      - run: pnpm ci
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm exec ng build --configuration=production --base-href=/sitmun-viewer-app/
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Validate build artifacts
        run: test -d dist/viewer-app && test -n "$(ls -A dist/viewer-app)"
