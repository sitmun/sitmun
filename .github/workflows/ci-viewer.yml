name: CI viewer

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

env:
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/config/npm-userconfig

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitmun-viewer
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm ci --filter ./sitmun-viewer...
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm exec ng build --configuration=production --base-href=/sitmun-viewer-app/
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Validate build artifacts
        run: test -f dist/viewer-app/index.html
