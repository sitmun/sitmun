name: Test Showcase PostgreSQL 16

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'profiles/showcase/**'
      - 'sitmun-backend/src/main/resources/db/changelog/**'
      - 'tools/tests/test_backend_db_boot.sh'
      - '.github/workflows/test-showcase-postgres-16.yml'
  merge_group:
    paths:
      - 'profiles/showcase/**'
      - 'sitmun-backend/src/main/resources/db/changelog/**'
      - 'tools/tests/test_backend_db_boot.sh'
      - '.github/workflows/test-showcase-postgres-16.yml'
  workflow_dispatch:

jobs:
  test-showcase-postgres-16:
    name: Test Showcase PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - name: Boot the showcase profile
        run: SITMUN_DB=postgres-16 SITMUN_PROFILE=showcase bash tools/tests/test_backend_db_boot.sh
