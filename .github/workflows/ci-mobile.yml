name: CI mobile

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

env:
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/config/npm-userconfig

jobs:
  build:
    name: ${{ matrix.label }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Edition
            dir: sitmun-mobile/sitmun-edition
          - label: Touristic
            dir: sitmun-mobile/sitmun-touristic
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm ci --filter ./${{ matrix.dir }}...
      - name: Run tests
        run: pnpm test
      - name: Check the lint problem count
        if: matrix.label == 'Edition'
        run: |
          # temporary: lint ratchet edition (#305). Original sources on this branch: 57.
          set +e
          pnpm exec ng lint > lint-out.txt 2>&1
          set -e
          if grep -q 'All files pass linting' lint-out.txt; then
            rm -f lint-out.txt
            exit 0
          fi
          problems=$(grep -o '[0-9][0-9]* problems' lint-out.txt | head -1 | cut -d' ' -f1)
          rm -f lint-out.txt
          echo "edition lint problems: ${problems:-missing}"
          if [ -z "$problems" ] || [ "$problems" -gt 57 ]; then
            echo "edition lint rose above 57"
            exit 1
          fi
      - name: Check the touristic lint problem count
        if: matrix.label == 'Touristic'
        run: |
          # temporary: lint ratchet touristic (#307)
          set +e
          pnpm exec ng lint > lint-out.txt 2>&1
          set -e
          if grep -q 'All files pass linting' lint-out.txt; then
            rm -f lint-out.txt
            exit 0
          fi
          problems=$(grep -o '[0-9][0-9]* problems' lint-out.txt | head -1 | cut -d' ' -f1)
          rm -f lint-out.txt
          echo "touristic lint problems: ${problems:-missing}"
          if [ -z "$problems" ] || [ "$problems" -gt 71 ]; then
            echo "touristic lint rose above 71"
            exit 1
          fi
      - name: Build the production app
        run: pnpm exec ng build --configuration=production
      - name: Check the build wrote index.html
        run: test -f www/index.html
