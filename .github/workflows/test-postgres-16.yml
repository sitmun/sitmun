name: Test PostgreSQL 16

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [dev]
    paths:
      - 'sitmun-backend/**'
      - 'profiles/postgres/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tools/tests/test_backend_db_boot.sh'
      - '.github/workflows/test-postgres-16.yml'
  workflow_dispatch:

jobs:
  test-postgres-16:
    name: Test PostgreSQL 16
    # Data REST calls return HTTP 500 and the log has no server exception.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SITMUN_DB: postgres-16
      SITMUN_DB_KEEP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - name: Boot the backend
        run: bash tools/tests/test_backend_db_boot.sh

      - name: Run backend tests
        if: ${{ !cancelled() }}
        run: ./gradlew :sitmun-backend:testPostgres16

      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-postgres-16-report
          path: sitmun-backend/build/reports/tests/testPostgres16
          retention-days: 7
