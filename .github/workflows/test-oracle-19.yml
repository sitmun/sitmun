name: Test Oracle 19

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
    branches: [dev, main]
  merge_group:
  workflow_dispatch:

jobs:
  changes:
    name: Select Oracle 19 scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.scope.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test the database selector
        run: python3 tools/tests/test_ci_db_scope.py
      - name: Select the database tier
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          INSTALL: oracle-19
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            python3 tools/bin/ci_db_scope.py --all --event "$EVENT" --base-ref "$BASE_REF" --install "$INSTALL" >> "$GITHUB_OUTPUT"
          else
            python3 tools/bin/ci_db_scope.py --base "$BASE" --head "$HEAD" --event "$EVENT" --base-ref "$BASE_REF" --install "$INSTALL" >> "$GITHUB_OUTPUT"
          fi

  # gvenzl/oracle-xe:21-slim is amd64 only and stands in for the 19c install.
  # ORACLE_DATABASE=sitmun3 is set by tools/tests/test_backend_db_boot.sh.
  test-oracle-19:
    name: Test Oracle 19
    needs: changes
    # Data REST calls return HTTP 500 and the log has no server exception.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SITMUN_DB: oracle-19
      SITMUN_DB_KEEP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - name: Boot the backend
        run: bash tools/tests/test_backend_db_boot.sh

      - name: Run backend tests
        if: ${{ !cancelled() }}
        run: ./gradlew :sitmun-backend:testOracle19

      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-oracle-19-report
          path: sitmun-backend/build/reports/tests/testOracle19
          retention-days: 7
