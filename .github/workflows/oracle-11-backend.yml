name: Oracle 11 backend

on:
  pull_request:
    branches: [dev]
    paths:
      - 'sitmun-backend/**'
      - 'profiles/oracle/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tools/tests/test_backend_oracle11_boot.sh'
      - '.github/workflows/oracle-11-backend.yml'
  workflow_dispatch:

jobs:
  # gvenzl/oracle-xe:11 is amd64 only. ubuntu-latest is amd64.
  backend-on-oracle-11:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - name: Boot the backend on Oracle XE 11
        run: bash tools/tests/test_backend_oracle11_boot.sh
