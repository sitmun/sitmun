name: Publish images

# A manual run, and a push of publish-1.3.0, publishes the 1.3.0 image tag.
# A v* tag publishes the version without the leading v, so v1.3.0 publishes 1.3.0.
# GitHub creates each package private. After the first push, set front, backend,
# proxy, and mbtiles to public in Package settings. The Packages API cannot do that.

on:
  push:
    tags:
      - "v*"
    branches:
      - publish-1.3.0
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Choose the image tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=1.3.0
          fi
          echo "SITMUN_VERSION=${version}" >> "$GITHUB_ENV"
          umask 077
          cat > "$RUNNER_TEMP/compose.env" << EOF
          SITMUN_VERSION=${version}
          ENVIRONMENT=production
          PUBLIC_BASE_PATH=/
          SITMUN_USER_SECRET=$(openssl rand -hex 32)
          MIDDLEWARE_SECRET=$(openssl rand -hex 32)
          SITMUN_MBTILES_JOB_HANDLE_SECRET=$(openssl rand -hex 32)
          EOF
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build the images
        env:
          ENVIRONMENT: production
          PUBLIC_BASE_PATH: /
        run: |
          export COMPOSE_PARALLEL_LIMIT=1
          docker compose --env-file "$RUNNER_TEMP/compose.env" \
            -f compose.yaml -f .github/docker/compose.ci.yaml \
            --profile mbtiles build front backend proxy mbtiles
      - name: Push the images
        run: |
          docker compose --env-file "$RUNNER_TEMP/compose.env" -f compose.yaml \
            --profile mbtiles push front backend proxy mbtiles
