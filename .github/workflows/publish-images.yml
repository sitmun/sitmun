name: Publish images

# A manual run publishes the 1.3.0 image tag.
# A tag vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-* publishes the image tag
# with the leading v removed.
# GitHub creates each package private. After the first push, set front, backend,
# proxy, and mbtiles to public in Package settings. The Packages API cannot do that.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Choose the image tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=1.3.0
          fi
          echo "SITMUN_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish the images
        run: SITMUN_BUILDER="${{ steps.buildx.outputs.name }}" tools/scripts/publish-images.sh "$SITMUN_VERSION"
