name: CI proxy

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitmun-proxy
    env:
      SPRING_PROFILES_ACTIVE: dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Publish sitmun-common to the local Maven repository
        working-directory: sitmun-common
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal
      - run: chmod +x gradlew
      - run: ./gradlew build
