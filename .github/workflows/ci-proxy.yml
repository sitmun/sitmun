name: CI proxy

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      SPRING_PROFILES_ACTIVE: dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew :sitmun-proxy:build
