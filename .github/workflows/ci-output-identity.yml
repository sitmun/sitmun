# temporary: build modernization output identity
name: CI Output Identity

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare ${{ matrix.label }} Production Output
    if: startsWith(github.head_ref, 'modernize/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Admin
            dir: sitmun-admin
            prefix: sitmun-admin/
            output: dist
          - label: Edition
            dir: sitmun-mobile/sitmun-edition
            prefix: sitmun-mobile/sitmun-edition/
            output: www
          - label: Touristic
            dir: sitmun-mobile/sitmun-touristic
            prefix: sitmun-mobile/sitmun-touristic/
            output: www
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -q "^${PREFIX}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pnpm
        if: steps.changed.outputs.changed == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - name: Set up Node
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Compare the production build
        if: steps.changed.outputs.changed == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          APP_DIR: ${{ matrix.dir }}
          OUTPUT: ${{ matrix.output }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/config/npm-userconfig
        run: |
          set -euo pipefail
          hash_at() {
            local rev="$1"
            local dest="$2"
            git checkout --force "$rev"
            rm -rf "${APP_DIR}/${OUTPUT}"
            pnpm ci --filter "./${APP_DIR}..."
            (
              cd "$APP_DIR"
              CI=1 pnpm exec ng build --configuration=production --source-map=false
            )
            find "${APP_DIR}/${OUTPUT}" -type f -exec sha256sum {} + | sort > "$dest"
          }
          hash_at "$BASE" /tmp/base.sha256
          hash_at "$HEAD" /tmp/head.sha256
          if ! cmp -s /tmp/base.sha256 /tmp/head.sha256; then
            diff -u /tmp/base.sha256 /tmp/head.sha256 || true
            exit 1
          fi
