services:
  front:
    build:
      cache_from:
        - type=gha,scope=front-${IMAGE_ARCH:-local}
      cache_to:
        - type=gha,scope=front-${IMAGE_ARCH:-local},mode=max
  backend:
    build:
      cache_from:
        - type=gha,scope=backend-${IMAGE_ARCH:-local}
      cache_to:
        - type=gha,scope=backend-${IMAGE_ARCH:-local},mode=max
  proxy:
    build:
      cache_from:
        - type=gha,scope=proxy-${IMAGE_ARCH:-local}
      cache_to:
        - type=gha,scope=proxy-${IMAGE_ARCH:-local},mode=max
  mbtiles:
    build:
      cache_from:
        - type=gha,scope=mbtiles-${IMAGE_ARCH:-local}
      cache_to:
        - type=gha,scope=mbtiles-${IMAGE_ARCH:-local},mode=max
