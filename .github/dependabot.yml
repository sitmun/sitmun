version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sitmun-admin
    target-branch: dev
    schedule:
      interval: weekly
    # Majors only. Patches and minors still open.
    # Angular 22 and its build, lint, and Jest packages move as one migration.
    # TipTap 2, ECharts 5, and ngx-echarts 19 each break their own API on a major.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-builders/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: angular-eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: jest-preset-angular
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: echarts
        update-types: ["version-update:semver-major"]
      - dependency-name: ngx-echarts
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
          - "@angular-builders/*"
          - angular-eslint
          - jest-preset-angular
      tiptap:
        patterns:
          - "@tiptap/*"
  - package-ecosystem: npm
    directory: /sitmun-viewer
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sitmun-mobile/sitmun-edition
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sitmun-mobile/sitmun-touristic
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # ojdbc10 stays on major 19. That line runs on JDK 17. 23.x is certified for Oracle 19, 21, and 23 only.
    ignore:
      - dependency-name: "com.oracle.database.jdbc:ojdbc10"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
