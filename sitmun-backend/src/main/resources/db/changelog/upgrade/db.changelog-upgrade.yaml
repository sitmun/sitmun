      id: upgrade-version-check-postgresql
      author: sitmun
      dbms: postgresql
      logicalFilePath: db/changelog/upgrade/00-version-check.postgresql.sql
      changes:
        - sqlFile:
            path: 00-version-check.postgresql.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
