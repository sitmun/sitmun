      id: legacy-1.2.9-version-check-postgresql
      author: sitmun
      dbms: postgresql
      logicalFilePath: db/changelog/legacy/01-version-check.postgresql.sql
      changes:
        - sqlFile:
            path: 01-version-check.postgresql.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
