  'SITMUN_ORACLE_URL', 'jdbc:oracle:thin:@//127.0.0.1:15230/sitmun3', false)

// Docker Compose configuration for PostgreSQL testing
dockerCompose {
  projectName = 'sitmun-backend-core'
  postgres {
    useComposeFiles = ['docker/postgres/test-docker-compose.yml']
    isRequiredBy(project.tasks.testPostgres)
    isRequiredBy(project.tasks.testRequiredCodeListsPostgres)
  }
  oracle {
    useComposeFiles = ['docker/oracle/test-docker-compose.yml']
    isRequiredBy(project.tasks.testOracle)
    isRequiredBy(project.tasks.testRequiredCodeListsOracle)
    // Oracle needs up to 160s (60s start_period + 20 retries x 5s)
    waitForHealthyStateTimeout = java.time.Duration.ofMinutes(5)
    retainContainersOnStartupFailure = true
  }
}

// All Database Tests
tasks.register('testAll', Test) {
  group = 'verification'
  description = 'Run tests with both H2 and PostgreSQL databases'
  
  dependsOn testH2, testPostgres
  
  // This task will run both test suites
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
  }
}

// Code coverage reporting
jacocoTestReport {
  reports {
    xml.required.set(true)
    html.required.set(true)
  }
}

test.finalizedBy jacocoTestReport

// Spotless code formatting

spotless {
  java {
    removeUnusedImports()
    googleJavaFormat(libs.versions.google.java.format.get())
    // importOrder 'java', 'javax', 'org', 'com'
    target '**/*.java'
    targetExclude '**/generated-sources/**'
  }
}

tasks.named('bootRun') {
    workingDir = layout.projectDirectory.asFile
}

springBoot {
  buildInfo()
}

def platformVersion = version
tasks.named('processResources') {
  filesMatching('static/v3/api-docs-*.yaml') {
    filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [version: platformVersion])
  }
}
