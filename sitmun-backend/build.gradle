def registerRequiredCodeLists = { String name, String profiles, String product, String version, String urlEnv, String urlDefault, boolean oracle11 ->
  tasks.register(name, Test) {
    group = 'verification'
    description = 'Production master must contain every code-list value the code reads'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    def jdbcUrl = System.getenv(urlEnv) ?: urlDefault
    systemProperty 'spring.profiles.active', profiles
    systemProperty 'spring.datasource.url', jdbcUrl
    systemProperty 'spring.liquibase.url', jdbcUrl
    systemProperty 'sitmun.test.database.enabled', 'true'
    systemProperty 'sitmun.test.database.product', product
    systemProperty 'sitmun.test.database.version', version
    systemProperty 'sitmun.test.required-codelists', 'true'
    systemProperty 'sitmun.test.changelog', System.getProperty('sitmun.test.changelog', 'shipped')
    systemProperty 'sitmun.test.sequence-counters', System.getProperty('sitmun.test.sequence-counters', 'true')
    systemProperty 'sitmun.user.secret', 'test-only-insecure-user-secret-32-bytes'
    systemProperty 'sitmun.proxy-middleware.secret', 'test-only-insecure-middleware-secret'
    if (oracle11) {
      systemProperty 'oracle.jdbc.timezoneAsRegion', 'false'
    }
    filter {
      includeTestsMatching 'org.sitmun.infrastructure.persistence.type.codelist.RequiredCodeListsTest'
    }
    testLogging {
      events "failed"
      exceptionFormat = 'full'
    }
  }
}

