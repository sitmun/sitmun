// These tasks do not start a database. tools/tests/test_backend_db_boot.sh does.
// gvenzl/oracle-xe is amd64 only.
tasks.register('testOracle11', Test) {
  group = 'verification'
  description = 'Run tests against a running Oracle 11g XE database at SITMUN_ORACLE_URL'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  def oracleUrl = System.getenv('SITMUN_ORACLE_URL') ?: 'jdbc:oracle:thin:@//127.0.0.1:15211/XE'
  systemProperty 'spring.profiles.active', 'test,oracle,oracle-11'
  systemProperty 'spring.datasource.url', oracleUrl
  systemProperty 'spring.liquibase.url', oracleUrl
  // Liquibase opens its own connection outside Hikari; Oracle 11 XE rejects Etc/UTC (ORA-01882).
  systemProperty 'oracle.jdbc.timezoneAsRegion', 'false'
  systemProperty 'sitmun.test.database.enabled', 'true'
  systemProperty 'sitmun.test.database.product', 'oracle'
  systemProperty 'sitmun.test.database.version', '11'
  systemProperty 'sitmun.user.secret', 'test-only-insecure-user-secret-32-bytes'
  systemProperty 'sitmun.proxy-middleware.secret', 'test-only-insecure-middleware-secret'
  testLogging {
    events "failed"
    exceptionFormat = 'full'
  }
}

