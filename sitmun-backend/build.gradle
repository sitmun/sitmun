import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
  id 'java'
  
  alias libs.plugins.spring.boot
  alias libs.plugins.spring.dependency.management
  
  alias libs.plugins.lombok
  alias libs.plugins.springdoc.openapi
  alias libs.plugins.liquibase
  
  id 'jacoco'

  alias libs.plugins.docker.compose

  alias libs.plugins.spotless
}

group = 'org.sitmun'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(rootProject.file('.java-version').text.trim())
  }
}

dependencyManagement {
  imports {
    mavenBom SpringBootPlugin.BOM_COORDINATES
  }
}

def packaging = (project.findProperty('packaging') ?: 'jar')

if (packaging == 'war') {
  apply plugin: 'war'
}

dependencies {

  // If packaging as WAR, use provided Tomcat runtime
  if (packaging == 'war') {
    providedRuntime libs.spring.boot.starter.tomcat
  }

  // Web + data persistence and REST API
  implementation libs.spring.boot.starter.webmvc
  implementation libs.spring.boot.starter.data.jpa
  implementation libs.spring.boot.starter.data.rest
  
  // Security and validation
  implementation libs.spring.boot.starter.security
  implementation libs.spring.boot.starter.validation
  
  // Monitoring and templating
  implementation libs.spring.boot.starter.actuator
  implementation libs.spring.boot.starter.thymeleaf
  
  // Development and testing database
  implementation libs.h2

  developmentOnly libs.spring.boot.devtools
  
  // Production databases
  implementation libs.postgresql
  implementation libs.oracle.jdbc
  implementation libs.hibernate.community.dialects
  implementation libs.mssql.jdbc

  // Database migration
  implementation libs.spring.boot.starter.liquibase
  
  // Query building
  implementation variantOf(libs.querydsl.jpa) { classifier('jakarta') }
  
  // Object mapping
  implementation libs.mapstruct

  // Apache Commons utilities
  implementation libs.commons.lang3
  implementation libs.commons.io
  implementation libs.opencsv
  
  // Google Guava utilities
  implementation libs.guava

  // OkHttp client with logging
  implementation platform(libs.okhttp.bom)
  implementation libs.okhttp
  implementation libs.okhttp.logging
  implementation project(':sitmun-spring-upstream')
  implementation project(':sitmun-proxy-contract')
  implementation libs.resilience4j.timelimiter

  // JSON processing
  implementation libs.json
  
  // JWT token handling
  implementation libs.jjwt.api
  implementation libs.jjwt.impl
  implementation libs.jjwt.jackson

  // OIDC support
  implementation libs.spring.boot.starter.security.oauth2.client

  // OpenAPI/Swagger documentation
  implementation libs.springdoc.openapi.starter.webmvc.ui

  // LDAP profile
  implementation libs.spring.ldap.core
  implementation libs.spring.security.ldap

  // Mail profile
  implementation libs.spring.boot.starter.mail

  // Rate limiting
  implementation libs.bucket4j.jdk17.core

  // HTML parsing (used by template export to convert HTML to W3C DOM)
  implementation libs.jsoup

  // PDF generation from HTML (template export)
  implementation libs.openhtmltopdf.core
  implementation libs.openhtmltopdf.pdfbox

  // URI Templates
  implementation libs.handyUriTemplates
  implementation libs.handlebars

  // Core annotation processing
  annotationProcessor libs.jakarta.annotation.api
  annotationProcessor libs.spring.boot.configuration.processor
  annotationProcessor libs.jakarta.persistence.api
  
  // QueryDSL code generation
  annotationProcessor variantOf(libs.querydsl.apt) { classifier('jakarta') }
  
  // MapStruct code generation
  annotationProcessor libs.mapstruct.processor

  // Development-time annotations
  compileOnly libs.jetbrains.annotations

  // Spring Boot test support
  testImplementation(libs.spring.boot.starter.test) {
    exclude group: 'com.vaadin.external.google', module: 'android-json'
  }
  testImplementation libs.spring.boot.starter.webmvc.test
  testImplementation libs.spring.boot.starter.data.jpa.test
  testImplementation libs.spring.boot.starter.jackson.test
  testImplementation libs.spring.boot.starter.security.test
  
  // Security testing
  testImplementation libs.spring.security.test
  
  // Testing utilities
  testImplementation libs.hamcrest
  testImplementation libs.junit.platform.launcher
  
  // LDAP testing (embedded LDAP server)
  testImplementation libs.unboundid.ldapsdk
  testImplementation libs.mockwebserver

}

// ============================================================================
// TESTING AND QUALITY ASSURANCE CONFIGURATION
// ============================================================================
// 
// Database Testing with Docker Compose Plugin
// ------------------------------------------
// The project uses the Gradle Docker Compose plugin for PostgreSQL testing.
// This provides automatic container lifecycle management with health checks.
// 
// Available tasks:
// - testPostgres: Run tests with PostgreSQL (automatically starts/stops container)
// - startPostgresTest: Start PostgreSQL container manually
// - stopPostgresTest: Stop PostgreSQL container manually  
// - cleanPostgresTest: Clean up containers and volumes
// 
// Configuration: docker/test-postgres-compose.yml
// ============================================================================

// Test configuration
tasks.withType(Test).configureEach {
  useJUnitPlatform()
  maxHeapSize = '1024m'
  minHeapSize = '64m'
  maxParallelForks = 1
  forkEvery = 0

  jvmArgs '-Xmx1024m', '-Xms64m', '-XX:+UseSerialGC'

  // Set system properties for test JVM
  systemProperty 'spring.profiles.active', 'test,h2'
  systemProperty 'java.awt.headless', 'true'
  systemProperty 'sitmun.platform.version', version
  systemProperty 'sitmun.user.secret', 'test-only-insecure-user-secret-32-bytes'
  systemProperty 'sitmun.proxy-middleware.secret', 'test-only-insecure-middleware-secret'
  // Forward opt-in Liquibase seed sequence canary (exact STM_SEQUENCE baselines)
  systemProperty 'sitmun.seed-canary.sequences', System.getProperty('sitmun.seed-canary.sequences', '')
  systemProperty 'sitmun.test.changelog', System.getProperty('sitmun.test.changelog', '')
  systemProperty 'sitmun.dictionary.fail', System.getProperty('sitmun.dictionary.fail', 'false')

  reports.junitXml.includeSystemOutLog = false
  reports.junitXml.includeSystemErrLog = false

  // Test logging
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
  }
}

// H2 Database Tests (default)
tasks.register('testH2', Test) {
  group = 'verification'
  description = 'Run tests with H2 in-memory database'
  systemProperty 'spring.profiles.active', 'test,h2'
  systemProperty 'sitmun.user.secret', 'test-only-insecure-user-secret-32-bytes'
  systemProperty 'sitmun.proxy-middleware.secret', 'test-only-insecure-middleware-secret'
  
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
  }
}

