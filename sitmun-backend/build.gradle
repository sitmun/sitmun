  systemProperty 'sitmun.test.database.version', '16'
  systemProperty 'sitmun.user.secret', 'test-only-insecure-user-secret-32-bytes'
  systemProperty 'sitmun.proxy-middleware.secret', 'test-only-insecure-middleware-secret'
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
  }
}

tasks.register('testOracle', Test) {
  group = 'verification'
  description = 'Run tests with OracleSQL database using Docker Compose'
  systemProperty 'spring.profiles.active', 'test,oracle'
  systemProperty 'sitmun.test.database.enabled', 'true'
  systemProperty 'sitmun.test.database.product', 'oracle'
  systemProperty 'sitmun.test.database.version', '23'
  systemProperty 'sitmun.user.secret', 'test-only-insecure-user-secret-32-bytes'
  systemProperty 'sitmun.proxy-middleware.secret', 'test-only-insecure-middleware-secret'
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
