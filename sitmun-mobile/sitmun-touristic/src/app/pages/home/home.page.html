<ion-header [translucent]="true">
</ion-header>

<ion-content [fullscreen]="true">
  <div id="container">
    <div class="language-selector">
      <ion-select [(ngModel)]="selectedLanguage" (ionChange)="setLanguage($event.detail.value)" interface="popover">
        <ion-select-option *ngFor="let lang of languageOptions" [value]="lang.code">
          {{ lang.emoji }} {{ lang.name }}
        </ion-select-option>
      </ion-select>
    </div>
    <ion-grid>
      <ion-row>
        <ion-col></ion-col>
        <ion-col>
          <div class="logo-content">
            <ion-img src="../../assets/icon/logo_sitmun_movil2.png"></ion-img>
          </div>
        </ion-col>
        <ion-col></ion-col>
      </ion-row>
      <ion-row>
        <ion-col>          
          <strong>{{ 'home.instanceSelection' | translate }}</strong>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col class="center">          
          <ion-select id="instance-selector" 
          [placeholder]="'home.sitmunInstance' | translate" [attr.aria-label]="'home.sitmunInstance' | translate"
            interface="action-sheet" cancelText="{{ 'exit.cancel' | translate }}"
            (ionChange)="onInstanceChange($event)">
            <ion-select-option *ngFor="let instance of instanceOptions" value="{{instance.value}}">{{instance.name}}</ion-select-option>
          </ion-select>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="2"></ion-col>
        <ion-col size="8">
          <ion-button expand="block" shape="round" (click)="access()" style="--background: #70889E;">{{ 'home.access' | translate }}</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
