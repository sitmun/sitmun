<ion-header [translucent]="true" mode="md">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="backPage()">
        <ion-icon name="arrow-back" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{rootNode['title']}}</ion-title>
    <ion-buttons slot="end">
      <ion-select [(ngModel)]="selectedLanguage" (ionChange)="setLanguage($event.detail.value)"
                  interface="popover">
        <ion-select-option *ngFor="let lang of languageOptions" [value]="lang.code">
           {{ lang.name }}
        </ion-select-option>
      </ion-select>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="grid-container">
    <div class="container">
      <div class="row" *ngFor="let node of nodes">
        <div class="card list-item mb-1" (click)="nextPage(node['id'])">
          <div class="row g-0">
            <div class="col-4 list-img-container my-auto" (click)="openModal($event, node['image'])">
              <ion-img class="list-img img-cover" src="{{node['image'] || '../../assets/icon/no-image.jpg'}}"></ion-img>
            </div>
            <div class="col-8">
              <div class="card-body">
                <h5 class="card-title">{{node['title']}}</h5>
                <p class="card-text">{{node['description']}}</p>
              </div>                
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ion-modal class="modal-img" [isOpen]="isModalOpen" (ionModalDidDismiss)="closeModal()">
    <ng-template>
        <ion-img src="{{ imageModal || '../../assets/icon/no-image.jpg' }}"></ion-img>
    </ng-template>
  </ion-modal>
</ion-content>

  <ion-toolbar>

        <div class="vertical-btn" (click)="startPage()">

          <ion-label class="ion-text-wrap text-dark">{{'home.title' | translate}}</ion-label>

    </ion-buttons>
