<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="backPage()">
        <ion-icon name="arrow-back" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{rootNode['title']}}</ion-title>
    <ion-buttons slot="end">
      <ion-select [(ngModel)]="selectedLanguage" (ionChange)="setLanguage($event.detail.value)"
                  interface="popover">
        <ion-select-option *ngFor="let lang of languageOptions" [value]="lang.code">
          {{ lang.emoji }} {{ lang.name }}
        </ion-select-option>
      </ion-select>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <div class="row mb-3" *ngFor="let elem of elements">
        <div class="col-3">
          <div class="list-img-container-sm my-auto">
            <ion-img class="list-img-sm img-cover" src="{{elem['image'] || '../../assets/icon/no-image.jpg'}}"></ion-img>
          </div>
        </div>
        <div class="col-7 text-dark">
          <h5>{{elem['name']}}</h5>             
        </div>
        <div class="col-2">
          <ion-button shape="round" class="access-btn dl-btn" (click)="nextElements(elem)">
            <ion-icon slot="icon-only" name="arrow-forward"></ion-icon>
          </ion-button>
          <ion-button shape="round" class="delete-btn dl-btn" (click)="deleteCategory(elem)">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-button>
        </div>
    </div>
    <div class="row fixed-bottom py-2 locate-bottom">
      <div class="d-flex justify-content-center">
        <ion-button shape="round" class="access-btn dl-btn" (click)="locateAllElements()">
          <ion-icon slot="icon-only" name="map"></ion-icon>
        </ion-button>
      </div> 
    </div> 
  </div> 
  
</ion-content>

  <ion-toolbar>

        <div class="vertical-btn" (click)="startPage()">
