<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="backPage()">
        <ion-icon name="arrow-back" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{rootNode['title']}}</ion-title>
    <ion-buttons slot="end">
      <ion-select [(ngModel)]="selectedLanguage" (ionChange)="setLanguage($event.detail.value)"
                  interface="popover">
        <ion-select-option *ngFor="let lang of languageOptions" [value]="lang.code">
          {{ lang.emoji }} {{ lang.name }}
        </ion-select-option>
      </ion-select>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div id="container">
    <div class="root-img-container" *ngIf="rootNode['image']">
      <ion-img [src]="rootNode['image']"></ion-img>
    </div>
    <div class="grid-container">
      <div class="container">
        <div class="row" *ngFor="let elem of elements">
          <div class="card list-item mb-1">
            <div class="row g-0">
              <div class="col-3 list-img-container-sm my-auto" (click)="openModalImg($event, elem['image'])">
                <ion-img class="list-img-sm img-cover" src="{{elem['image'] || '../../assets/icon/no-image.jpg'}}"></ion-img>
              </div>
              <div class="col-7">
                <div class="card-body">
                  <h5 class="card-title">{{elem['name']}}</h5>
                  <p *ngIf="elem['description']" class="card-text" [innerHTML]="elem['description'].substring(0, 50) + '...'"></p>
                </div>                
              </div>
              <div class="col-2 my-auto">
                <ion-button shape="round" class="favorite-btn dl-btn" [ngClass]="{'active' : elem['isFav']}" (click)="toggleFavorite($event, elem)">
                  <ion-icon slot="icon-only" name="heart"></ion-icon>
                </ion-button>
                <ion-button shape="round" class="location-btn dl-btn" (click)="locateElement(elem)">
                  <ion-icon slot="icon-only" name="location"></ion-icon>
                </ion-button>
              </div>
            </div>
            <div class="row">
              <ion-accordion-group *ngIf="elem['description'] || elem.schedule || elem.price">
                <ion-accordion value="first">
                  <ion-item slot="header" class="mx-auto">
                    <ion-label class="extraInfo-label">{{'moreInfo' | translate}}</ion-label>
                    <ion-icon name="chevron-down" slot="end" class="ion-accordion-toggle-icon"></ion-icon>
                  </ion-item>
                  <div class="extraInfo-content ion-padding container" slot="content">
                    <div class="row extraInfo-data mb-5">
                      <div *ngIf="elem['description']" [innerHTML]="elem['description']"></div>
                    </div>
                    <div class="row justify-content-evenly">
                      <div class="col-6">
                        <ion-button class="access-btn w-100" shape="round" *ngIf="elem.schedule" (click)="openExtraInfoModal('schedule', elem.schedule)">{{'schedule' | translate}}</ion-button>
                      </div>
                      <div class="col-6">
                        <ion-button class="access-btn w-100" shape="round" *ngIf="elem.price" (click)="openExtraInfoModal('price', elem.price)">{{'price' | translate}}</ion-button>
                      </div>
                    </div>
                  </div>
                </ion-accordion>
              </ion-accordion-group>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ion-modal id="extraInfo-modal" #modal [isOpen]="isModalOpen" (ionModalDidDismiss)="closeExtraInfoModal()">
    <ng-template>
      <div class="wrapper container">
        <div class="row">
          <h1>{{currentExtraInfo.title | translate}}</h1>
        </div>
        <div class="row">
          <div class="extraInfo-content" [innerHTML]="currentExtraInfo.content">
        </div>       
        </div>
        <div class="row">
          <div class="col">
            <ion-button class="access-btn" expand="block" (click)="closeExtraInfoModal()">Ok</ion-button>
          </div>
        </div>
      </div>
    </ng-template>
  </ion-modal>

  <ion-modal class="modal-img" [isOpen]="isModalOpenImg" (ionModalDidDismiss)="closeModalImg()">
    <ng-template>
        <ion-img src="{{ imageModal || '../../assets/icon/no-image.jpg' }}"></ion-img>
    </ng-template>
  </ion-modal>
</ion-content>
