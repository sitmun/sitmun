plugins {
    alias(libs.plugins.spotless) apply false
}

def libraryProjects = [':sitmun-spring-upstream', ':sitmun-proxy-contract']

subprojects { sub ->
    sub.version = rootProject.version
    if (!(sub.path in libraryProjects)) {
        return
    }
    sub.group = 'org.sitmun'
    sub.pluginManager.withPlugin('java') {
        sub.apply plugin: 'com.diffplug.spotless'
        sub.java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(rootProject.file('.java-version').text.trim())
            }
        }
        sub.tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
        sub.tasks.named('test') {
            useJUnitPlatform()
        }
        sub.spotless {
            java {
                removeUnusedImports()
                googleJavaFormat(libs.versions.google.java.format.get())
                target 'src/**/*.java'
            }
        }
    }
}
