# Oracle 11g. Activate profile oracle-11 on its own.
spring:
  datasource:
    hikari:
      data-source-properties:
        # Send the session time zone as an offset. Oracle 11 XE rejects region names such as
        # Etc/UTC with ORA-01882 when the connection opens.
        oracle.jdbc.timezoneAsRegion: "false"
  jpa:
    properties:
      hibernate.dialect: org.hibernate.community.dialect.OracleLegacyDialect
      # Oracle uses NUMBER(1,0) for booleans; INTEGER (code 4) binds as int 0/1
      # NUMERIC (code 2) fails because BooleanJavaType cannot unwrap to BigDecimal
      hibernate.type.preferred_boolean_jdbc_type: INTEGER
