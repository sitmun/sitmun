  - changeSet:
      id: showcase-data-2-sequences
      author: sitmun
      context: showcase
      comment: Move the id counters past the showcase rows so the admin can keep creating records.
      changes:
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('TER_ID', (SELECT COALESCE(MAX(TER_ID), 0) + 1 FROM STM_TERRITORY)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('ROL_ID', (SELECT COALESCE(MAX(ROL_ID), 0) + 1 FROM STM_ROLE)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('USE_ID', (SELECT COALESCE(MAX(USE_ID), 0) + 1 FROM STM_USER)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('CON_ID', (SELECT COALESCE(MAX(CON_ID), 0) + 1 FROM STM_CONNECT)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('SER_ID', (SELECT COALESCE(MAX(SER_ID), 0) + 1 FROM STM_SERVICE)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('PSE_ID', (SELECT COALESCE(MAX(PSE_ID), 0) + 1 FROM STM_PAR_SER)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('GEO_ID', (SELECT COALESCE(MAX(GEO_ID), 0) + 1 FROM STM_GEOINFO)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('GGI_ID', (SELECT COALESCE(MAX(GGI_ID), 0) + 1 FROM STM_GRP_GI)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('AGI_ID', (SELECT COALESCE(MAX(AGI_ID), 0) + 1 FROM STM_AVAIL_GI)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('BAC_ID', (SELECT COALESCE(MAX(BAC_ID), 0) + 1 FROM STM_BACKGRD)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('TAS_ID', (SELECT COALESCE(MAX(TAS_ID), 0) + 1 FROM STM_TASK)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
              INSERT INTO STM_SEQUENCE(SEQ_NAME, SEQ_COUNT) VALUES ('ATS_ID', (SELECT COALESCE(MAX(ATS_ID), 0) + 1 FROM STM_AVAIL_TSK)) ON CONFLICT (SEQ_NAME) DO UPDATE SET SEQ_COUNT = EXCLUDED.SEQ_COUNT;
