[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
spotless = "7.2.0"
google-java-format = "1.28.0"
jjwt = "0.12.6"
handy-uri-templates = "2.1.8"
okhttp = "5.5.0"
json = "20250517"
lombok = "8.6"
axion-release = "1.19.0"
mime4j = "0.8.12"
jetbrains-annotations = "26.0.2"
mbtiles4j = "1.2.0"
proj4j = "1.1.5"
dom4j = "2.1.4"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-core = { module = "org.springframework:spring-core" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-batch = { module = "org.springframework.boot:spring-boot-starter-batch" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-jdbc-test" }
spring-boot-starter-tomcat = { module = "org.springframework.boot:spring-boot-starter-tomcat" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
json = { module = "org.json:json", version.ref = "json" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
handyUriTemplates = { module = "com.damnhandy:handy-uri-templates", version.ref = "handy-uri-templates" }
mime4j-core = { module = "org.apache.james:apache-mime4j-core", version.ref = "mime4j" }
h2 = { module = "com.h2database:h2" }
postgresql = { module = "org.postgresql:postgresql" }
oracle-jdbc = { module = "com.oracle.database.jdbc:ojdbc11-production" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
lombok = { module = "org.projectlombok:lombok" }
mbtiles4j = { module = "ch.poole.geo:mbtiles4j", version.ref = "mbtiles4j" }
proj4j = { module = "org.locationtech.proj4j:proj4j", version.ref = "proj4j" }
dom4j = { module = "org.dom4j:dom4j", version.ref = "dom4j" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion-release" }
