pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'sitmun'

include 'sitmun-spring-upstream'
project(':sitmun-spring-upstream').projectDir = file('sitmun-common/sitmun-spring-upstream')

include 'sitmun-proxy-contract'
project(':sitmun-proxy-contract').projectDir = file('sitmun-common/sitmun-proxy-contract')

include 'sitmun-proxy'
project(':sitmun-proxy').projectDir = file('sitmun-proxy')

include 'sitmun-mbtiles'
project(':sitmun-mbtiles').projectDir = file('sitmun-addons/sitmun-mbtiles')

include 'sitmun-backend'
project(':sitmun-backend').projectDir = file('sitmun-backend')
