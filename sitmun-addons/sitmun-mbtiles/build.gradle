plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.lombok)
    alias(libs.plugins.spotless)
    alias(libs.plugins.axion.release)
}

group = 'org.sitmun'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.file('.java-version').text.trim())
    }
}

dependencies {
    implementation libs.spring.boot.starter.batch
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.actuator
    implementation libs.hibernate.validator

    implementation libs.mbtiles4j
    implementation libs.proj4j
    implementation libs.dom4j

    runtimeOnly libs.h2

    compileOnly libs.jetbrains.annotations

    developmentOnly libs.spring.boot.devtools

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.webmvc.test

    annotationProcessor libs.spring.boot.configuration.processor
    annotationProcessor libs.lombok
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

spotless {
    java {
        googleJavaFormat(libs.versions.google.java.format.get())
    }
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

scmVersion {
    ignoreUncommittedChanges.set(true)
    tag {
        prefix = 'sitmun-mbtiles'
        versionSeparator = '/'
        initialVersion({config, position -> '1.0.0'})
    }
    versionIncrementer('incrementPatch')
}

project.version = scmVersion.version

def resolveGitHooksDir = {
    def gitMarker = new File(project.rootDir, '.git')
    if (gitMarker.isFile()) {
        def text = gitMarker.getText('UTF-8').trim()
        def prefix = 'gitdir:'
        if (text.startsWith(prefix)) {
            def path = text.substring(prefix.length()).trim()
            def gitDir = new File(path)
            if (!gitDir.isAbsolute()) {
                gitDir = new File(project.rootDir, path)
            }
            return new File(gitDir, 'hooks')
        }
    }
    new File(gitMarker, 'hooks')
}

tasks.register('setupGitHooks') {
    group = 'git hooks'
    description = 'Install Git hooks for commit message validation and pre-commit checks'
    def hookDir = resolveGitHooksDir()
    def commitMsgHook = new File(hookDir, 'commit-msg')
    def preCommitHook = new File(hookDir, 'pre-commit')

    doLast {
        hookDir.mkdirs()

        preCommitHook.text = '''#!/bin/sh
            echo "🔍 Running pre-commit checks..."
            
            # Code formatting check
            echo "  📝 Checking code formatting..."
            ./gradlew spotlessCheck
            if [ $? -ne 0 ]; then
                echo "❌ Code formatting check failed. Run './gradlew spotlessApply' to fix."
                exit 1
            fi
            
            # Tests
            echo "  🧪 Running tests..."
            ./gradlew test
            if [ $? -ne 0 ]; then
                echo "❌ Tests failed. Please fix the failing tests."
                exit 1
            fi
            
            # Code coverage check
            echo "  📊 Checking code coverage..."
            ./gradlew jacocoTestReport
            if [ $? -ne 0 ]; then
                echo "❌ Code coverage check failed."
                exit 1
            fi
            
            echo "✅ All pre-commit checks passed!"
        '''.stripIndent()
        preCommitHook.setExecutable(true)

        commitMsgHook.text = '''#!/bin/sh
            commit_msg=$(cat $1)
            
            # Conventional commit pattern for SITMUN MBTiles
            pattern="^(feat|fix|docs|style|refactor|test|chore|perf|ci|build)(\\(mbtiles\\))?: .+"
            
            if ! echo "$commit_msg" | grep -qE "$pattern"; then
                echo "❌ Invalid commit message format."
                echo ""
                echo "Expected: <type>(mbtiles): <description>"
                echo ""
                echo "Types:"
                echo "  feat     - New feature"
                echo "  fix      - Bug fix"
                echo "  docs     - Documentation changes"
                echo "  style    - Code style changes"
                echo "  refactor - Code refactoring"
                echo "  test     - Test changes"
                echo "  chore    - Maintenance tasks"
                echo "  perf     - Performance improvements"
                echo "  ci       - CI/CD changes"
                echo "  build    - Build system changes"
                echo ""
                echo "Examples:"
                echo "  feat(mbtiles): add tile merging functionality"
                echo "  fix(mbtiles): resolve memory leak in tile processing"
                echo "  docs: update README with MBTiles compliance info"
                echo "  test: add integration tests for WMTS harvesting"
                echo "  style: format code with Google Java Format"
                echo "  refactor: improve tile coordinate calculation"
                echo "  chore: update dependencies to latest versions"
                echo "  perf: optimize tile processing performance"
                echo "  ci: add GitHub Actions workflow"
                echo "  build: update Gradle configuration"
                exit 1
            fi
            
            echo "✅ Commit message format is valid!"
        '''.stripIndent()
        commitMsgHook.setExecutable(true)


        println "✅ Git hooks installed successfully!"
        println "📋 Pre-commit hook: Runs tests, formatting, and security checks"
        println "📝 Commit-msg hook: Validates conventional commit message format"
        println ""
        println "💡 Usage examples:"
        println "  git commit -m \"feat: add tile merging functionality\""
        println "  git commit -m \"fix: resolve memory leak\""
        println "  git commit -m \"docs: update README\""
        println "  git commit -m \"test: add integration tests\""
    }
}

tasks.register('removeGitHooks') {
    group = 'git hooks'
    description = 'Remove Git hooks'
    def hookDir = resolveGitHooksDir()

    doLast {
        ['pre-commit', 'commit-msg'].each { hookName ->
            def hookFile = new File(hookDir, hookName)
            if (hookFile.exists()) {
                hookFile.delete()
                println "🗑️  Removed ${hookName} hook"
            }
        }
        println "✅ Git hooks removed successfully!"
    }
}
