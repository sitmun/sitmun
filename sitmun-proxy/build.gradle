plugins {
  id 'java'
  id 'jacoco'
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dependency.management)
  alias(libs.plugins.lombok)
  alias(libs.plugins.spotless)
}

group = 'org.sitmun'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(rootProject.file('.java-version').text.trim())
  }
}


def packaging = (project.findProperty('packaging') ?: 'jar')

if (packaging == 'war') {
  apply plugin: 'war'
}


dependencies {

  // If packaging as WAR, use provided Tomcat runtime
  if (packaging == 'war') {
    providedRuntime libs.spring.boot.starter.tomcat
  }

  // Spring Boot Starters
  implementation libs.spring.boot.starter.webmvc
  implementation libs.spring.boot.starter.restclient
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation libs.spring.boot.starter.jdbc
  implementation libs.spring.boot.starter.actuator

  // JSON and JWT
  implementation libs.json
  implementation libs.jjwt.api
  implementation libs.jjwt.impl
  implementation libs.jjwt.jackson

  // HTTP Client
  implementation libs.okhttp3
  implementation libs.mime4j.core
  implementation project(':sitmun-proxy-contract')

  // URI Templates
  implementation libs.handyUriTemplates

  // Database Drivers
  implementation libs.postgresql
  implementation libs.oracle.jdbc
  implementation libs.mssql.jdbc

  // Development tools (excluded from production builds)
  developmentOnly libs.spring.boot.devtools

  // Test Dependencies
  testImplementation(libs.spring.boot.starter.test) {
    exclude group: 'com.vaadin.external.google', module: 'android-json'
  }
  testImplementation libs.spring.boot.starter.webmvc.test
  testImplementation libs.spring.boot.starter.jdbc.test

  testImplementation libs.h2
}

tasks.named('test', Test) {
  useJUnitPlatform()
  // Deployable config files require SITMUN_BACKEND_CONFIG_SECRET; supply a
  // deterministic non-placeholder value so tests resolve without external env.
  systemProperty 'sitmun.backend.config.secret', 'test-only-insecure-middleware-secret'
}

// Spotless configuration
spotless {
  java {
    googleJavaFormat(libs.versions.google.java.format.get())
  }
}

// JaCoCo configuration
jacocoTestReport {
  reports {
    xml.required = true
  }
}

tasks.named('bootRun') {
    workingDir = layout.projectDirectory.asFile
}
